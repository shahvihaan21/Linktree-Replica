<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />
    <meta name="description" content="Vihaan Shah — student, writer, and analytical thinker." />
    <title>Vihaan Shah — Links</title>
    <link rel="stylesheet" href="src/styles.css" />
    <style>
      /* ── Loading Screen ── */
      .loader-screen {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #070809;
        transition: opacity .5s ease, visibility .5s ease;
      }
      .loader-screen.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
      .loader-spinner {
        width: 36px; height: 36px;
        border: 2.5px solid rgba(255,255,255,.08);
        border-top-color: #b9c6ff;
        border-radius: 50%;
        animation: loader-spin .7s linear infinite;
      }
      .loader-text {
        margin-top: 18px;
        color: #777a86;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: .14em;
        text-transform: uppercase;
        animation: loader-pulse 1.6s ease-in-out infinite;
      }
      @keyframes loader-spin { to { transform: rotate(360deg); } }
      @keyframes loader-pulse { 0%,100% { opacity: .4; } 50% { opacity: 1; } }

      /* ── Resume Loading Overlay ── */
      .resume-loader {
        position: fixed; inset: 0; z-index: 9998;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: rgba(7,8,9,.92);
        backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        opacity: 0; visibility: hidden; pointer-events: none;
        transition: opacity .35s ease, visibility .35s ease;
      }
      .resume-loader.is-active { opacity: 1; visibility: visible; pointer-events: auto; }
      .resume-loader .loader-spinner { border-top-color: #e2e5ef; }
      .resume-loader .loader-text { color: #a5a7b0; }
    </style>
  </head>
  <body>
    <!-- Page Loading Screen -->
    <div class="loader-screen" id="loader-screen" aria-live="polite">
      <div class="loader-spinner"></div>
      <p class="loader-text">Loading</p>
    </div>

    <!-- Resume Loading Overlay -->
    <div class="resume-loader" id="resume-loader" aria-live="polite">
      <div class="loader-spinner"></div>
      <p class="loader-text">Resume Loading</p>
    </div>

    <main class="page-shell">


      <section class="hub" aria-labelledby="page-title">
        <header class="identity">
          <div class="avatar">
            <img src="Assets/Vihaan.png" alt="Vihaan Shah" />
          </div>
          <p class="eyebrow">PERSONAL HUB</p>
          <h1 id="page-title">Vihaan Shah</h1>
          <p class="bio">BBA Leadership student and blogger focused on insight analysis and blogging.</p>
          <nav class="socials" id="socials" aria-label="Social profiles"></nav>
        </header>

        <nav class="link-list" id="link-list" aria-label="Primary links"></nav>

        <section class="about" id="about">
          <button class="about-trigger" type="button" aria-expanded="false" aria-controls="about-content">
            <span>Click to Know More</span>
            <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
              <path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
            </svg>
          </button>
          <div class="about-content" id="about-content" aria-hidden="true">
            <p>I’m a BBA student exploring the intersection of leadership, business, and analytics. This space is a Hub— To All my learning and socials.</p>
          </div>
        </section>

        <footer>
          <span>© Vihaan Shah</span>
          <i aria-hidden="true"></i>
          <span>India</span>
          <i aria-hidden="true"></i>
          <a href="Vihaan%20Shah%20Resume.pdf" target="_blank" rel="noopener noreferrer" style="color: inherit; text-decoration: none;">Resume</a>
        </footer>
      </section>
    </main>

    <script src="src/site-data.js"></script>
    <script src="src/script.js"></script>
    <script>
      // ── Page loader dismiss ──
      window.addEventListener('load', function() {
        var loader = document.getElementById('loader-screen');
        if (loader) {
          setTimeout(function() { loader.classList.add('is-hidden'); }, 300);
          setTimeout(function() { loader.remove(); }, 900);
        }
      });

      // ── Resume loading overlay ──
      (function() {
        var resumeOverlay = document.getElementById('resume-loader');
        if (!resumeOverlay) return;
        document.querySelectorAll('a[href*="Resume.pdf"]').forEach(function(link) {
          link.addEventListener('click', function() {
            resumeOverlay.classList.add('is-active');
            setTimeout(function() { resumeOverlay.classList.remove('is-active'); }, 2200);
          });
        });
      })();
    </script>
  </body>
</html>
